<style>
*{box-sizing:border-box}

.label{font-family:var(--font-mono);letter-spacing:.12em;text-transform:uppercase}

<img src="../../logos/cahut-logo-horizontal.svg" alt="Cahut" style="position:absolute;left:80px;top:72px;height:50px">

<div style="position:absolute;left:80px;top:190px;width:600px">

<div style="position:absolute;left:80px;bottom:64px;display:flex;gap:10px"><span class="mono" style="display:inline-block;padding:6px 14px;border:1px solid var(--cahut-ink-300);border-radius:999px;font-size:17px;color:var(--cahut-ink-700);">Open source</span><span class="mono" style="display:inline-block;padding:6px 14px;border:1px solid var(--cahut-ink-300);border-radius:999px;font-size:17px;color:var(--cahut-ink-700);">Self-hosted</span><span class="mono" style="display:inline-block;padding:6px 14px;border:1px solid var(--cahut-ink-300);border-radius:999px;font-size:17px;color:var(--cahut-ink-700);">MCP</span><span class="mono" style="display:inline-block;padding:6px 14px;border:1px solid var(--cahut-ink-300);border-radius:999px;font-size:17px;color:var(--cahut-ink-700);">Go</span></div>
