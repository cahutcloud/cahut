<!doctype html>
<html lang="en">
<head>

<title>Cahut, diapositive de contenu</title>

<style>
*{box-sizing:border-box}

body{width:1920px;height:1080px;overflow:hidden;font-family:var(--font-sans);color:var(--cahut-ink);background:var(--cahut-paper);-webkit-font-smoothing:antialiased;position:relative}

</style>

<body>

<div style="position:absolute;left:120px;top:96px;right:120px">
  <div class="label" style="font-size:20px;color:var(--cahut-ink-600)">Results</div>
  <h1 style="font-size:68px;line-height:76px;font-weight:800;letter-spacing:-0.02em;margin-top:14px">Windows published each month</h1>
</div>
<div style="position:absolute;left:120px;top:330px;width:700px;font-size:32px;line-height:48px">

<div style="position:absolute;right:120px;top:330px;width:860px;height:520px;background:#fff;border:1px solid var(--cahut-ink-200);border-radius:28px;padding:48px 56px">

</div>
<div style="position:absolute;left:120px;right:120px;bottom:64px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--cahut-ink-200);padding-top:28px">

  <span class="mono" style="font-size:20px;color:var(--cahut-ink-600)">cahut.cloud · 07</span>
