name: Bug report
description: Something that Cahut does wrong, and how to see it.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. A bug we can reproduce is a bug we can fix. Questions go to the Discussions, and vulnerabilities go through SECURITY.md, never here.
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `cahut version`.
      placeholder: cahut 0.3.0 (abc1234)
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How Cahut was installed
      options:
        - install.sh on a server
        - A release archive, by hand
        - make dev or go run, on this machine
        - Another way, said below
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: The distribution and its version, and the AI client if it plays a part.
      placeholder: AlmaLinux 9.6, Claude Code 2.1
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, step by step, so that we can do the same.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Messages, screenshots, and the lines of the Logbook that go with it, from `cahut logbook`. Remove any token or password.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I searched the existing issues and discussions.
          required: true
        - label: I reproduced this myself. If an AI helped me write this report, I say so above.
          required: true
