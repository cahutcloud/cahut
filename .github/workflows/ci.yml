name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check that go.mod is tidy
        run: go mod tidy -diff
      - name: Check that the reference of the docs is up to date
        run: |
          make docs-reference
          if [ -n "$(git status --porcelain -- "$DOCS_REFERENCE")" ]; then
            git add --intent-to-add -- "$DOCS_REFERENCE"
            git diff -- "$DOCS_REFERENCE"
            echo "::error::The reference of the docs is out of date: run make docs-reference and commit the result."
            exit 1
          fi
        env:
          DOCS_REFERENCE: sites/docs.cahut.cloud/src/content/docs/reference
      - name: Check that the types of the console's API are up to date
        run: |
          make console-types
          if [ -n "$(git status --porcelain -- "$CONSOLE_TYPES")" ]; then
            git add --intent-to-add -- "$CONSOLE_TYPES"
            git diff -- "$CONSOLE_TYPES"
            echo "::error::The types of the console's API are out of date: run make console-types and commit the result."
            exit 1
          fi
        env:
          CONSOLE_TYPES: internal/console/ui/src/api.gen.ts
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0 # GOLANGCI_LINT_VERSION in the Makefile

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make test

  # install.sh on the blank Ubuntu machine of GitHub, then an update and a
  # rollback. test/install/lima.sh runs the same on AlmaLinux.
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build two versions of the binary
        run: |
          for v in 0.0.0-ci.1 0.0.0-ci.2; do
            CGO_ENABLED=0 go build -trimpath -ldflags "-X cahut.cloud/internal/version.version=$v" -o "$RUNNER_TEMP/cahut-$v" ./cmd/cahut
          done
      - name: Install, update and roll back
        run: sudo sh test/install/run.sh install.sh "$RUNNER_TEMP/cahut-0.0.0-ci.1" "$RUNNER_TEMP/cahut-0.0.0-ci.2"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: internal/console/ui/package-lock.json
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3 # GORELEASER_VERSION in the Makefile
          args: build --snapshot --clean
      - name: Check that the binaries are static, run, and hold the console
        run: |
          for bin in dist/*/cahut; do
            file "$bin"
            file "$bin" | grep -q "statically linked"
            go version -m "$bin" | grep -q -- "-tags=console"
          done
          dist/cahut_linux_amd64_v1/cahut version
