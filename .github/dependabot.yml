# Weekly pull requests for Go modules, for the npm packages of the sites,
# and for the actions pinned by commit hash in .github/workflows.
#
# Minor and patch updates of each ecosystem come in one pull request a week.
# Major updates keep a pull request each, since they may need code changes.
# A package matches the first group that names it: astro and vite stay
# together with their plugins, majors included.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /sites
    schedule:
      interval: weekly
    # A release waits a week, so that a compromised one is caught first.
    cooldown:
      default-days: 7
    groups:
      astro:
        patterns:
          - astro
          - "@astrojs/*"
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /internal/console/ui
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      vite:
        patterns:
          - vite
          - "@preact/*"
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
