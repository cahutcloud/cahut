# GoReleaser builds the release archives and drafts the GitHub release.
# See docs/adr/0007-module-path-repository-and-releases.md.
version: 2

project_name: cahut

# The console is built once, then embedded in every binary with the console
# tag. See docs/adr/0005-preact-console-embedded.md.
before:
  hooks:
    - make console

builds:
  - main: ./cmd/cahut
    binary: cahut
    tags:
      - console
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X cahut.cloud/internal/version.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

checksum:
  name_template: checksums.txt

# An Ed25519 key signs the checksum file, which names every archive: servers
# check the signature against the keys embedded in Cahut before they install
# a release. The key comes from the CAHUT_RELEASE_KEY secret of the release
# workflow; make snapshot skips the signature. See
# docs/adr/0024-signed-releases-and-updates.md.
signs:
  - id: checksums
    artifacts: checksum
    cmd: go
    args: ["run", "./internal/releasesign", "-output", "${signature}", "${artifact}"]
    signature: "${artifact}.sig"

snapshot:
  version_template: "{{ incpatch .Version }}-dev+{{ .ShortCommit }}"

changelog:
  sort: asc

release:
  # A person reviews and publishes each release by hand. Servers only
  # update to published releases.
  draft: true
  # A new run for a tag replaces the draft of an earlier run, so a tag
  # never ends up with two drafts. Edits made to that draft are lost.
  replace_existing_draft: true
  prerelease: auto
